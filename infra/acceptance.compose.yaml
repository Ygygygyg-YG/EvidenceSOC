name: evidencesoc-task12-acceptance

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: evidencesoc
      POSTGRES_USER: evidencesoc
      POSTGRES_PASSWORD: ${TASK12_POSTGRES_PASSWORD:?Set the isolated acceptance password}
    ports:
      - "127.0.0.1:${TASK12_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_acceptance:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencesoc -d evidencesoc"]
      interval: 5s
      timeout: 5s
      retries: 18

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      - cluster.name=evidencesoc-task12-acceptance
      - node.name=acceptance-opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "127.0.0.1:${TASK12_OPENSEARCH_PORT:-9202}:9200"
    volumes:
      - opensearch_acceptance:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

volumes:
  postgres_acceptance:
  opensearch_acceptance:
